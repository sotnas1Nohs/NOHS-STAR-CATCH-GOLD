<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NOHS STAR CATCH GOLD</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#050510;
font-family:Arial,sans-serif;
color:white;
touch-action:none;
}

#game{
width:100%;
height:100%;
display:flex;
flex-direction:column;
background:
radial-gradient(circle at 50% 20%,#182052 0,#08091a 45%,#03030b 100%);
}

#topbar{
height:86px;
padding:8px 10px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
background:rgba(0,0,0,.35);
border-bottom:1px solid rgba(255,255,255,.12);
z-index:10;
}

.stat{
text-align:center;
font-size:11px;
font-weight:bold;
color:#bfc8ff;
}

.stat b{
display:block;
font-size:17px;
color:white;
margin-top:3px;
}

#playArea{
position:relative;
flex:1;
overflow:hidden;
background:
radial-gradient(circle at 50% 45%,rgba(55,75,150,.18),transparent 45%);
}

#levelTitle{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
font-size:17px;
font-weight:bold;
letter-spacing:1px;
z-index:5;
white-space:nowrap;
}

#message{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:13px;
font-weight:bold;
z-index:8;
color:#fff;
text-shadow:0 0 8px #fff;
white-space:nowrap;
}

.player{
position:absolute;
width:54px;
height:54px;
border-radius:50%;
background:
radial-gradient(circle at 35% 30%,#fff,#b86cff 18%,#7528d8 55%,#35106d 100%);
box-shadow:
0 0 10px #b85cff,
0 0 25px rgba(145,55,255,.8);
transform:translate(-50%,-50%);
z-index:20;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

.player:after{
content:"★";
color:white;
text-shadow:0 0 8px white;
}

.star{
position:absolute;
transform:translate(-50%,-50%);
font-size:28px;
z-index:12;
filter:drop-shadow(0 0 7px gold);
}

.danger{
position:absolute;
transform:translate(-50%,-50%);
font-size:29px;
z-index:13;
filter:drop-shadow(0 0 8px red);
}

.power{
position:absolute;
transform:translate(-50%,-50%);
font-size:28px;
z-index:14;
}

.bullet{
position:absolute;
width:12px;
height:24px;
border-radius:8px;
background:#fff;
box-shadow:
0 0 6px #fff,
0 0 14px #00eaff,
0 0 24px #00eaff;
transform:translate(-50%,-50%);
z-index:25;
}

#joystick{
position:absolute;
bottom:18px;
left:18px;
width:100px;
height:100px;
border-radius:50%;
border:3px solid rgba(255,255,255,.7);
background:rgba(255,255,255,.08);
z-index:50;
touch-action:none;
}

#fireButton{
position:absolute;
bottom:24px;
right:20px;
width:92px;
height:92px;
border-radius:50%;
border:3px solid rgba(255,110,70,.95);
background:rgba(255,55,25,.22);
color:white;
font-size:15px;
font-weight:bold;
z-index:50;
touch-action:none;
box-shadow:
0 0 10px rgba(255,70,30,.45),
inset 0 0 15px rgba(255,80,30,.2);
}

#fireButton:active{
transform:scale(.92);
background:rgba(255,60,30,.45);
}

#overlay{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,.78);
z-index:100;
text-align:center;
padding:20px;
}

#overlay h1{
font-size:27px;
margin:0 0 12px;
}

#overlay p{
font-size:16px;
margin:5px;
}

#nextButton{
margin-top:20px;
padding:14px 28px;
border:0;
border-radius:12px;
background:#7c3cff;
color:white;
font-size:16px;
font-weight:bold;
}

@media(max-width:420px){

#joystick{
left:12px;
bottom:15px;
}

#fireButton{
right:12px;
bottom:20px;
}

}
</style>
</head>

<body>

<div id="game">

<div id="topbar">

<div class="stat">
SCORE
<b id="score">0</b>
</div>

<div class="stat">
LIVES
<b id="lives">3</b>
</div>

<div class="stat">
TARGET
<b id="target">5</b>
</div>

<div class="stat">
LEVEL
<b id="level">1</b>
</div>

</div>

<div id="playArea">

<div id="levelTitle">STAR GARDEN</div>
<div id="message"></div>

<div id="player" class="player"></div>

<div id="joystick"></div>

<button id="fireButton" type="button">🔥 FIRE</button>

<div id="overlay">

<h1 id="overlayTitle"></h1>

<p id="overlayText"></p>

<button id="nextButton" type="button">
NEXT LEVEL
</button>

</div>

</div>
</div>

<script>

var levels=[
{name:"STAR GARDEN",target:5,normal:"⭐",danger:"💣",speed:150},
{name:"METEOR RAIN",target:6,normal:"⭐",danger:"☄️",speed:185},
{name:"MAGNET WORLD",target:7,normal:"⭐",danger:"💣",speed:175},
{name:"DARK NIGHT",target:7,normal:"⭐",danger:"💣",speed:190},
{name:"TREASURE HUNT",target:8,normal:"💎",danger:"💣",speed:180},
{name:"FIRE ZONE",target:8,normal:"⭐",danger:"🔥",speed:200},
{name:"ICE ZONE",target:9,normal:"❄️",danger:"🧊",speed:175},
{name:"STORM ZONE",target:9,normal:"⚡",danger:"🌩️",speed:205},
{name:"GOLDEN RUSH",target:10,normal:"🥇",danger:"💣",speed:220},
{name:"FINAL GALAXY",target:12,normal:"⭐",danger:"👑",speed:230}
];

var playArea=document.getElementById("playArea");
var player=document.getElementById("player");
var joystick=document.getElementById("joystick");
var fireButton=document.getElementById("fireButton");

var scoreEl=document.getElementById("score");
var livesEl=document.getElementById("lives");
var targetEl=document.getElementById("target");
var levelEl=document.getElementById("level");
var levelTitle=document.getElementById("levelTitle");
var message=document.getElementById("message");

var overlay=document.getElementById("overlay");
var overlayTitle=document.getElementById("overlayTitle");
var overlayText=document.getElementById("overlayText");
var nextButton=document.getElementById("nextButton");

var currentLevel=1;
var score=0;
var lives=3;
var levelScore=0;
var playing=true;

var playerX=50;
var playerY=0;

var objects=[];
var bullets=[];
var powerItems=[];

var joystickActive=false;
var joystickPointerId=null;
var joystickCenterX=0;
var joystickCenterY=0;

var moveDX=0;
var moveDY=0;

var lastTime=0;
var spawnTimer=0;
var powerTimer=0;
var fireCooldown=0;

var magnet=false;
var shield=false;
var fever=false;

var magnetTime=0;
var shieldTime=0;
var feverTime=0;

function getLevel(){
return levels[currentLevel-1];
}

function updateStats(){

scoreEl.textContent=score;
livesEl.textContent=lives;
targetEl.textContent=getLevel().target;
levelEl.textContent=currentLevel;
levelTitle.textContent=getLevel().name;

}

function showMessage(text){

message.textContent=text;

clearTimeout(showMessage.timer);

showMessage.timer=setTimeout(function(){
message.textContent="";
},900);

}

function randomX(){
return 8+Math.random()*84;
}

function createObject(type){

var o={
type:type,
x:randomX(),
y:-35,
speed:getLevel().speed*(.75+Math.random()*.5),
el:null
};

var el=document.createElement("div");

el.className=
type==="star" ? "star" : "danger";

el.textContent=
type==="star"
?getLevel().normal
:getLevel().danger;

el.style.left=o.x+"%";
el.style.top=o.y+"px";

playArea.appendChild(el);

o.el=el;

objects.push(o);

}

function spawnThings(delta){

spawnTimer+=delta;

var interval=
Math.max(500,950-currentLevel*35);

if(spawnTimer<interval)return;

spawnTimer=0;

if(Math.random()<.72){
createObject("star");
}else{
createObject("danger");
}

}

function createPower(){

var types=["magnet","shield","life","fever"];

var type=
types[Math.floor(Math.random()*types.length)];

var icons={
magnet:"🧲",
shield:"🛡️",
life:"❤️",
fever:"🔥"
};

var o={
type:type,
x:randomX(),
y:-35,
speed:115,
el:null
};

var el=document.createElement("div");

el.className="power";
el.textContent=icons[type];

el.style.left=o.x+"%";
el.style.top=o.y+"px";

playArea.appendChild(el);

o.el=el;

powerItems.push(o);

}

function spawnPowers(delta){

powerTimer+=delta;

if(powerTimer<6500)return;

powerTimer=0;

createPower();

}

function distance(ax,ay,bx,by){

var dx=ax-bx;
var dy=ay-by;

return Math.sqrt(dx*dx+dy*dy);

}

function touching(x,y){

var px=playerX/100*playArea.clientWidth;
var py=playerY;

return distance(
px,py,
x/100*playArea.clientWidth,y
)<43;

}

function nearPlayer(x,y){

var px=playerX/100*playArea.clientWidth;
var py=playerY;

return distance(
px,py,
x/100*playArea.clientWidth,y
)<150;

}

function removeObject(index){

if(index<0||index>=objects.length)return;

var o=objects[index];

if(o&&o.el)o.el.remove();

objects.splice(index,1);

}

function removeBullet(index){

if(index<0||index>=bullets.length)return;

var b=bullets[index];

if(b&&b.el)b.el.remove();

bullets.splice(index,1);

}

function removePower(index){

if(index<0||index>=powerItems.length)return;

var p=powerItems[index];

if(p&&p.el)p.el.remove();

powerItems.splice(index,1);

}

function collectObject(index){

var o=objects[index];

if(!o)return;

var points=fever?2:1;

if(currentLevel===10)points=fever?3:3;

levelScore+=points;
score+=points;

showMessage("+"+points+" ⭐");

removeObject(index);

updateStats();

if(levelScore>=getLevel().target){
completeLevel();
}

}

function hitByDanger(index){

var o=objects[index];

if(!o)return;

removeObject(index);

if(shield){

showMessage("🛡️ SHIELD BLOCKED!");
return;

}

lives--;

updateStats();

showMessage("💥 HIT!");

if(lives<=0){
gameOver();
}

}

function collectPower(index){

var p=powerItems[index];

if(!p)return;

if(p.type==="magnet"){
magnet=true;
magnetTime=6000;
showMessage("🧲 MAGNET!");
}

if(p.type==="shield"){
shield=true;
shieldTime=7000;
showMessage("🛡️ SHIELD!");
}

if(p.type==="life"){
lives++;
showMessage("❤️ EXTRA LIFE!");
}

if(p.type==="fever"){
fever=true;
feverTime=6000;
showMessage("🔥 FEVER!");
}

removePower(index);

updateStats();

}

function updateObjects(delta){

var height=playArea.clientHeight;

for(var i=objects.length-1;i>=0;i--){

var o=objects[i];

if(!o)continue;

if(typeof o.y!=="number"){
removeObject(i);
continue;
}

o.y+=o.speed*delta/1000;

if(magnet&&o.type==="star"&&nearPlayer(o.x,o.y)){

var dx=
playerX*playArea.clientWidth/100-
o.x*playArea.clientWidth/100;

var dy=playerY-o.y;

o.x+=
dx/playArea.clientWidth*0.025*100;

o.y+=dy*0.025;

}

if(!o.el){
removeObject(i);
continue;
}

o.el.style.left=o.x+"%";
o.el.style.top=o.y+"px";

if(touching(o.x,o.y)){

if(o.type==="star"){
collectObject(i);
}else{
hitByDanger(i);
}

continue;
}

if(i>=objects.length)continue;
if(objects[i]!==o)continue;

if(o.y>height+50){
removeObject(i);
}

}

}

function updatePowerItems(delta){

var height=playArea.clientHeight;

for(var i=powerItems.length-1;i>=0;i--){

var p=powerItems[i];

if(!p)continue;

if(typeof p.y!=="number"){
removePower(i);
continue;
}

p.y+=p.speed*delta/1000;

if(!p.el){
removePower(i);
continue;
}

p.el.style.left=p.x+"%";
p.el.style.top=p.y+"px";

if(touching(p.x,p.y)){

collectPower(i);
continue;

}

if(i>=powerItems.length)continue;
if(powerItems[i]!==p)continue;

if(p.y>height+50){
removePower(i);
}

}

}

function updatePowersTime(delta){

if(magnet){

magnetTime-=delta;

if(magnetTime<=0){
magnet=false;
magnetTime=0;
}

}

if(shield){

shieldTime-=delta;

if(shieldTime<=0){
shield=false;
shieldTime=0;
}

}

if(fever){

feverTime-=delta;

if(feverTime<=0){
fever=false;
feverTime=0;
}

}

}

function movePlayer(dx,dy){

var w=playArea.clientWidth;
var h=playArea.clientHeight;

var px=playerX/100*w;
var py=playerY;

px+=dx;
py+=dy;

px=Math.max(27,Math.min(w-27,px));
py=Math.max(80,Math.min(h-55,py));

playerX=px/w*100;
playerY=py;

player.style.left=playerX+"%";
player.style.top=playerY+"px";

}

function startJoystick(e){

e.preventDefault();

joystickActive=true;
joystickPointerId=e.pointerId;

var r=joystick.getBoundingClientRect();

joystickCenterX=r.left+r.width/2;
joystickCenterY=r.top+r.height/2;

updateJoystick(e.clientX,e.clientY);

}

function updateJoystick(x,y){

if(!joystickActive)return;

var dx=x-joystickCenterX;
var dy=y-joystickCenterY;

var max=42;

var dist=Math.sqrt(dx*dx+dy*dy);

if(dist>max){

dx=dx/dist*max;
dy=dy/dist*max;

}

moveDX=dx/max;
moveDY=dy/max;

}

function endJoystick(){

joystickActive=false;
joystickPointerId=null;
moveDX=0;
moveDY=0;

}

joystick.addEventListener(
"pointerdown",
startJoystick
);

joystick.addEventListener(
"pointermove",
function(e){

if(e.pointerId!==joystickPointerId)return;

updateJoystick(e.clientX,e.clientY);

});

joystick.addEventListener(
"pointerup",
endJoystick
);

joystick.addEventListener(
"pointercancel",
endJoystick
);

document.addEventListener(
"pointerup",
function(e){

if(e.pointerId===joystickPointerId){
endJoystick();
}

});

function fireBullet(){

if(!playing)return;

if(fireCooldown>0)return;

fireCooldown=220;

var b={
x:playerX,
y:playerY-35,
speed:520,
el:null
};

var el=document.createElement("div");

el.className="bullet";

el.style.left=b.x+"%";
el.style.top=b.y+"px";

playArea.appendChild(el);

b.el=el;

bullets.push(b);

}

fireButton.addEventListener(
"pointerdown",
function(e){

e.preventDefault();
fireBullet();

});

function updateBullets(delta){

for(var i=bullets.length-1;i>=0;i--){

var b=bullets[i];

if(!b)continue;

if(typeof b.y!=="number"){

removeBullet(i);
continue;

}

b.y-=b.speed*delta/1000;

if(!b.el){

removeBullet(i);
continue;

}

b.el.style.left=b.x+"%";
b.el.style.top=b.y+"px";

var removed=false;

for(var j=objects.length-1;j>=0;j--){

var o=objects[j];

if(!o)continue;

if(o.type!=="danger")continue;

if(
Math.abs(b.x-o.x)<6 &&
Math.abs(b.y-o.y)<35
){

removeObject(j);
removeBullet(i);

showMessage(
"💥 ENEMY DESTROYED!"
);

score+=1;

updateStats();

removed=true;

break;

}

}

if(removed)continue;

if(i>=bullets.length)continue;

if(b.y<-40){
removeBullet(i);
}

}

}

function updateMovement(delta){

if(moveDX===0&&moveDY===0)return;

var amount=0.30;

movePlayer(
moveDX*amount*delta,
moveDY*amount*delta
);

}

function resetLevel(){

objects.forEach(function(o){

if(o&&o.el){
o.el.remove();
}

});

bullets.forEach(function(b){

if(b&&b.el){
b.el.remove();
}

});

powerItems.forEach(function(p){

if(p&&p.el){
p.el.remove();
}

});

objects=[];
bullets=[];
powerItems=[];

levelScore=0;

playerX=50;

/* PLAYER STARTS AT THE BOTTOM */
playerY=playArea.clientHeight-90;

if(playerY<80){
playerY=80;
}

player.style.left=playerX+"%";
player.style.top=playerY+"px";

magnet=false;
shield=false;
fever=false;

magnetTime=0;
shieldTime=0;
feverTime=0;

spawnTimer=0;
powerTimer=0;
fireCooldown=0;

playing=true;

overlay.style.display="none";

updateStats();

lastTime=performance.now();

requestAnimationFrame(gameLoop);

}

function completeLevel(){

if(!playing)return;

playing=false;

overlay.style.display="flex";

overlayTitle.textContent=
"LEVEL "+currentLevel+" COMPLETE!";

if(currentLevel<10){

overlayText.textContent=
"Great! Score: "+score;

nextButton.textContent=
"NEXT LEVEL";

nextButton.style.display="block";

}else{

overlayText.textContent=
"🏆 YOU COMPLETED ALL 10 LEVELS!";

nextButton.textContent=
"CHAMPION!";

nextButton.style.display="block";

}

}

function gameOver(){

playing=false;

overlay.style.display="flex";

overlayTitle.textContent=
"GAME OVER";

overlayText.textContent=
"Final Score: "+score;

nextButton.textContent=
"PLAY AGAIN";

nextButton.style.display="block";

}

nextButton.addEventListener(
"click",
function(){

if(currentLevel>=10){

currentLevel=1;
score=0;
lives=3;

}else{

currentLevel++;

}

resetLevel();

});

document.addEventListener(
"keydown",
function(e){

if(e.key==="ArrowLeft"){
moveDX=-1;
}

if(e.key==="ArrowRight"){
moveDX=1;
}

if(e.key==="ArrowUp"){
moveDY=-1;
}

if(e.key==="ArrowDown"){
moveDY=1;
}

if(e.code==="Space"){

e.preventDefault();
fireBullet();

}

});

document.addEventListener(
"keyup",
function(e){

if(
e.key==="ArrowLeft"||
e.key==="ArrowRight"
){

moveDX=0;

}

if(
e.key==="ArrowUp"||
e.key==="ArrowDown"
){

moveDY=0;

}

});

function setPlayerAtBottom(){

playerY=
playArea.clientHeight-90;

if(playerY<80){
playerY=80;
}

player.style.left=
playerX+"%";

player.style.top=
playerY+"px";

}

function gameLoop(time){

if(!playing)return;

var delta=
time-lastTime;

if(delta>80){
delta=80;
}

if(delta<0){
delta=0;
}

lastTime=time;

fireCooldown=
Math.max(0,fireCooldown-delta);

updatePowersTime(delta);

updateMovement(delta);

spawnThings(delta);

spawnPowers(delta);

if(!playing)return;

updateObjects(delta);

if(!playing)return;

updateBullets(delta);

if(!playing)return;

updatePowerItems(delta);

if(!playing)return;

requestAnimationFrame(gameLoop);

}

setPlayerAtBottom();

updateStats();

lastTime=performance.now();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
